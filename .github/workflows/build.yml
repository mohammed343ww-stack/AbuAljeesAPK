name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/abualjees/player app/src/main/assets app/src/main/res/drawable
          mv MainActivity.java app/src/main/java/com/abualjees/player/
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv index.html app/src/main/assets/index.html
          mv ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml
          mv app-build.gradle app/build.gradle
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: abu-aljees-apk
          path: app/build/outputs/apk/debug/app-debug.apk
